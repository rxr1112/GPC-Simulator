let dragging=false;cvs.onpointerdown=e=>{dragging=true;cvs.setPointerCapture(e.pointerId);selectAt(e)};cvs.onpointermove=e=>{if(dragging&&page===2)selectAt(e);else{const p=locate(e);cvs.style.cursor=hits.some(b=>p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h)?'pointer':'default'}};cvs.onpointerup=()=>dragging=false;cvs.onpointercancel=()=>dragging=false;
$('prev').onclick=()=>setPage(Math.max(0,page-1));$('next').onclick=()=>setPage(Math.min(4,page+1));$('lang').onclick=()=>{en=!en;render()};$('clock').onclick=()=>{clockRunning=!clockRunning;$('clock').classList.toggle('active',clockRunning)};$('timer').ondblclick=()=>{seconds=600;clockAccum=0;clockRunning=false;$('clock').classList.remove('active');$('timer').textContent='10:00'};$('close').onclick=()=>$('figureDialog').close();document.addEventListener('visibilitychange',()=>{if(document.hidden){playing=false;clockRunning=false;$('clock').classList.remove('active');renderControls()}});window.addEventListener('resize',resize);
function tick(now){const dt=last?Math.min(.06,(now-last)/1000):0;last=now;if(playing){if(page===0){phase+=dt/4;if(phase>=1){phase=0;flowStep++;if(flowStep>=5){flowStep=4;playing=false;phase=1}renderAside();renderControls()}}if(page===2){phase=Math.min(1.08,phase+dt/9);if(phase>=1.08){playing=false;renderControls()}renderAside()}if(page===3){phase+=dt/4;if(phase>=1){phase=0;flowStep++;if(flowStep>=6){flowStep=5;playing=false}renderAside();renderControls()}}draw()}if(clockRunning&&seconds>0){clockAccum+=dt;if(clockAccum>=1){seconds--;clockAccum-=1;$('timer').textContent=Math.floor(seconds/60).toString().padStart(2,'0')+':'+(seconds%60).toString().padStart(2,'0')}}requestAnimationFrame(tick)}render();requestAnimationFrame(tick);

let paperPlayback=false,paperTime=20,paperPlaying=false,paperLast=0;
const priorResultDraw=drawResults;
function originalReveal(x,y,w,h,t){
 c.drawImage(img,x,y,w,h);
 const sx=128,sy=22,sw=546,sh=468;
 const q=Math.max(0,Math.min(1,(t-20)/12)),cut=sx+sw*q;
 // Preserve exact raster curves: conceal unreached portions rather than generating a fitted trace.
 c.fillStyle='white';
 c.fillRect(x+cut/700*w,y+sy/550*h,(sx+sw-cut)/700*w,118/550*h);
 // Solvent responses occupy the right-hand region below the product baseline.
 const solventCut=Math.max(cut,128+7/12*546);
 c.fillRect(x+solventCut/700*w,y+140/550*h,(674-solventCut)/700*w,350/550*h);
 // Keep axes and tick labels intact while the curve area is revealed.
 c.drawImage(img,0,468,700,82,x,y+468/550*h,w,82/550*h);
 c.drawImage(img,674,0,26,550,x+674/700*w,y,26/700*w,h);
 const px=x+cut/700*w;
 line(px,y+sy/550*h,px,y+(sy+sh)/550*h,'#217b65',1.5);
}
drawResults=function(){
 if(!paperPlayback){priorResultDraw();return}
 const left=45,right=W-115,top=35,colH=60,detX=W-76;
 box(left,top,right-left,colH,'#122d31','#578578',12);
 for(let x=left+27;x<right-15;x+=36){dot(x,top+30,10,'#365c4e');dot(x,top+30,4,'#122d31')}
 box(detX,top-5,28,colH+10,'#2b514c','#8fe1c1',5);arrow(right+4,top+30,detX-4,top+30);
 text(T('色谱柱：三组样品对照示意','Column: schematic sample comparison'),left,21,'#b8c8d1',12);
 text(T('检测器','Detector'),detX+14,21,'#8fe1c1',11,'center');
 data.forEach((d,i)=>{const arrival=(paperTime-20)/(d.t-20),px=left+Math.min(1.1,arrival)*(detX-left),yy=top+15+i*15;if(arrival<=1.06){dot(px,yy,4+i,d.color)}if(Math.abs(paperTime-d.t)<.25){box(detX-3,top-8,34,colH+16,'#537c5e','#d7f9a8',6)} });
 const iw=img.naturalWidth||700,ih=img.naturalHeight||550,fit=Math.min((W-30)/iw,(H-140)/ih),w=iw*fit,h=ih*fit,x=(W-w)/2,y=125;
 box(x-4,y-4,w+8,h+8,'#fff',null,5);if(img.complete)originalReveal(x,y,w,h,paperTime);
 text(T('原图逐步显影 · 流动为示意','Original-image reveal · schematic flow'),W/2,H-8,'#aabec8',11,'center');
};
const oldResultControls=renderControls;
renderControls=function(){oldResultControls();if(page!==4)return;
 $('controls').insertAdjacentHTML('afterbegin',button('paperAuto',paperPlaying?'⏸ 暂停显影':paperPlayback?'▶ 继续显影':'▶ 同步检测与成峰',paperPlaying?'⏸ Pause reveal':paperPlayback?'▶ Resume reveal':'▶ Flow & paper peaks','primary')+button('paperReplay','↺ 重播','↺ Replay'));
 $('paperAuto').onclick=()=>{if(!paperPlayback){paperPlayback=true;paperTime=20}paperPlaying=!paperPlaying;renderControls();renderAside();draw()};
 $('paperReplay').onclick=()=>{paperPlayback=true;paperTime=20;paperPlaying=true;renderControls();renderAside();draw()};
};
const oldResultAside=renderAside;
renderAside=function(){oldResultAside();if(page===4&&paperPlayback){const note=document.createElement('div');note.className='readout';note.textContent=T('原图洗脱位置：','Original elution position: ')+paperTime.toFixed(2)+' min · '+T('三组样品分开测量，此处并列示意。','Samples measured separately; shown together schematically.');const previous=$('explain').querySelector('.note');if(previous)previous.replaceWith(note)}};
const oldPageSetter=setPage;
setPage=function(i){paperPlayback=false;paperPlaying=false;paperTime=20;oldPageSetter(i)};
function paperFrame(now){const dt=paperLast?Math.min(.06,(now-paperLast)/1000):0;paperLast=now;if(page===4&&paperPlayback&&paperPlaying&&!document.hidden&&!$('figureDialog').open){paperTime=Math.min(32,paperTime+dt*.6);if(paperTime>=32){paperPlaying=false;paperPlayback=false;renderControls();renderAside()}else if(Math.floor(paperTime*5)!==Math.floor((paperTime-dt*.6)*5))renderAside();draw()}requestAnimationFrame(paperFrame)}
requestAnimationFrame(paperFrame);if(page===4)renderControls();
</script></body></html>
